<figure class="diagram" markdown="0">
<svg viewBox="0 0 800 420" role="img" aria-labelledby="fig-repos-title fig-repos-desc">
<title id="fig-repos-title">The BLIS repositories and how they depend on blis-schemas</title>
<desc id="fig-repos-desc">blis-catalog and blis-registry hold data and run blis-schemas validators in CI. blis-latency-kernel imports blis-schemas and reads the catalog and registry files when a kernel is constructed. blis-vllm imports blis-schemas and implements its Engine interface. inference-sim imports the kernel, blis-vllm and blis-schemas.</desc>
<defs>
<marker id="repos-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,1 L9,5 L0,9 z"/></marker>
<marker id="repos-ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead-accent" d="M0,1 L9,5 L0,9 z"/></marker>
</defs>
<rect class="box-plain" x="10" y="15" width="210" height="290" rx="8"/>
<text class="small" x="24" y="36">data repositories · YAML and JSON</text>
<rect class="box" x="25" y="52" width="180" height="72" rx="5"/>
<text class="title" x="39" y="78">blis-catalog</text>
<text class="small" x="39" y="97">declared facts: models, chips,</text>
<text class="small" x="39" y="112">fabrics, storage, workloads</text>
<rect class="box" x="25" y="215" width="180" height="72" rx="5"/>
<text class="title" x="39" y="241">blis-registry</text>
<text class="small" x="39" y="260">coefficient sets: measured,</text>
<text class="small" x="39" y="275">cited or assumed values</text>
<rect class="box-accent" x="330" y="132" width="180" height="76" rx="5"/>
<text class="title accent-text" x="344" y="158">blis-schemas</text>
<text class="small" x="344" y="177">document types, validators,</text>
<text class="small" x="344" y="192">Kernel and Engine interfaces</text>
<rect class="box" x="600" y="52" width="190" height="72" rx="5"/>
<text class="title" x="614" y="78">blis-latency-kernel</text>
<text class="small" x="614" y="97">implements Kernel: prices</text>
<text class="small" x="614" y="112">memory and one forward pass</text>
<rect class="box" x="600" y="215" width="190" height="72" rx="5"/>
<text class="title" x="614" y="241">inference-sim</text>
<text class="small" x="614" y="260">discrete-event simulator:</text>
<text class="small" x="614" y="275">the clock, routing, clusters</text>
<rect class="box" x="330" y="315" width="180" height="72" rx="5"/>
<text class="title" x="344" y="341">blis-vllm</text>
<text class="small" x="344" y="360">implements Engine: vLLM's</text>
<text class="small" x="344" y="375">scheduler, KV cache, rules</text>
<path class="edge-accent dashed" d="M330,152 L207,104" marker-end="url(#repos-ah-accent)"/>
<text class="small accent-text" x="236" y="150">validates</text>
<path class="edge-accent dashed" d="M330,188 L207,236" marker-end="url(#repos-ah-accent)"/>
<text class="small accent-text" x="236" y="197">validates</text>
<path class="edge" d="M600,100 L512,150" marker-end="url(#repos-ah)"/>
<path class="edge" d="M600,240 L512,190" marker-end="url(#repos-ah)"/>
<path class="edge" d="M695,215 L695,126" marker-end="url(#repos-ah)"/>
<path class="edge" d="M420,315 L420,210" marker-end="url(#repos-ah)"/>
<path class="edge" d="M600,270 L512,335" marker-end="url(#repos-ah)"/>
<path class="edge dotted" d="M600,66 L222,66" marker-end="url(#repos-ah)"/>
<text class="small" x="300" y="58">reads catalog and registry files when constructed</text>
<text class="small" x="10" y="412">Solid: Go import. Dashed: a blis-schemas command the repository runs in CI. Dotted: file reads.</text>
</svg>
<figcaption>Who depends on whom. blis-schemas imports nothing from the other five. The data repositories contain no Go; they run its validators in CI. The kernel and blis-vllm import its types and implement its interfaces, and the simulator imports all three.</figcaption>
</figure>
