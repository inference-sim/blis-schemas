<figure class="diagram" markdown="0">
<svg viewBox="0 0 800 250" role="img" aria-labelledby="fig-val-title fig-val-desc">
<title id="fig-val-title">The validation pipeline</title>
<desc id="fig-val-desc">Files are loaded with strict decoding. Field validation checks each document and then the deployment against the scenario's cluster. Only if the field layer reports no error does rule validation run, using the pack registered for the scenario's engine version. The report keeps field and rule problems apart. Name resolution against a catalog is a separate entry point.</desc>
<defs>
<marker id="val-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,1 L9,5 L0,9 z"/></marker>
<marker id="val-ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead-accent" d="M0,1 L9,5 L0,9 z"/></marker>
</defs>
<rect class="box" x="10" y="50" width="130" height="78" rx="5"/>
<text class="title" x="22" y="74">Load</text>
<text class="small" x="22" y="93">strict decode;</text>
<text class="small" x="22" y="108">unknown key fails</text>
<rect class="box-accent" x="190" y="50" width="180" height="78" rx="5"/>
<text class="title accent-text" x="202" y="74">Field layer</text>
<text class="small" x="202" y="93">each document, then the</text>
<text class="small" x="202" y="108">deployment against its cluster</text>
<rect class="box-accent" x="440" y="50" width="180" height="78" rx="5"/>
<text class="title accent-text" x="452" y="74">Rule layer</text>
<text class="small" x="452" y="93">the pack registered for</text>
<text class="mono" x="452" y="110">engine_version</text>
<rect class="box" x="650" y="36" width="140" height="106" rx="5"/>
<text class="title" x="662" y="60">Report</text>
<line class="edge" x1="662" y1="70" x2="778" y2="70"/>
<text class="mono" x="662" y="90">Field</text>
<text class="mono" x="662" y="110">Rule</text>
<text class="mono" x="662" y="130">RulesApplied</text>
<path class="edge" d="M140,89 L188,89" marker-end="url(#val-ah)"/>
<path class="edge-accent" d="M370,89 L438,89" marker-end="url(#val-ah-accent)"/>
<text class="small accent-text" x="378" y="81">no error</text>
<path class="edge" d="M620,89 L648,89" marker-end="url(#val-ah)"/>
<path class="edge dashed" d="M280,50 C280,22 720,22 720,34" marker-end="url(#val-ah)"/>
<text class="small" x="410" y="14">any field error: rules do not run</text>
<rect class="box-plain" x="10" y="178" width="350" height="56" rx="5"/>
<text class="title" x="22" y="200">Name check</text>
<text class="mono" x="110" y="200">ValidateAgainstCatalog</text>
<text class="small" x="22" y="220">do the names the scenario uses exist in a catalog on disk?</text>
<text class="small" x="430" y="200">Validate never reads the disk.</text>
<text class="small" x="430" y="220">The name check is the one that does.</text>
</svg>
<figcaption>Two layers and one separate step. A field problem is always the author's to fix. A rule problem may mean the document is right and the engine version it names is wrong.</figcaption>
</figure>
