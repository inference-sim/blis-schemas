name: ci
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      # Formatting first: a diff here is mechanical and would otherwise obscure a
      # real failure below.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test -race ./...

  # The yaml tags are a contract with the files in blis-catalog and blis-registry.
  # Until something parses those files the tags are untested: a misspelled tag
  # compiles, validates, and silently drops the field it was meant to read.
  #
  # The catalog half of that contract is now checked against a pinned, in-tree snapshot
  # (testdata/, vendored by hand) in the main test job above: the LoadCatalog tests load
  # AND validate every committed artifact there, and a missing fixture fails rather than
  # skips. That removes the moving-target this job used to have for the catalog — it
  # checked out inference-sim/blis-catalog at live main, so an unrelated catalog change
  # could redden this repo's build. The registry has no vendored snapshot yet, so it is
  # still parsed from a live checkout here (its own pinning is a separate change).
  parse-committed-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/checkout@v4
        with:
          repository: inference-sim/blis-registry
          path: blis-registry
          fetch-depth: 1
      - name: parse every committed registry file
        env:
          BLIS_REGISTRY: ${{ github.workspace }}/blis-registry
        run: go test -v -run 'LoadRegistry' .

  # The acceptance schedule and the kernel's DP padding are transcribed from vLLM v0.31.0; these
  # tests re-derive them from a checkout and fail on any divergence. (The engine releases' rules
  # packs, and their own constants checks, are the engine model's: blis-vllm's rules module.)
  constants-against-engine-v0_31:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: check out the engine at the pinned release
        uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          ref: v0.31.0
          path: vllm-source
          fetch-depth: 1
      - name: verify pack constants
        env:
          VLLM_SOURCE: ${{ github.workspace }}/vllm-source
          VLLM_SOURCE_REQUIRED: "1"
        run: go test -v -run MatchSource ./spec/acceptance/ ./kernel/

  # The replay descriptor's aiperf constants, re-derived from the aiperf release the
  # inferencex-agentx-mvp scenario is transcribed from.
  constants-against-aiperf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: check out aiperf at the pinned release
        uses: actions/checkout@v4
        with:
          repository: ai-dynamo/aiperf
          ref: v0.12.0
          path: aiperf-source
          fetch-depth: 1
      - name: verify replay constants
        env:
          AIPERF_SOURCE: ${{ github.workspace }}/aiperf-source/src/aiperf
          AIPERF_SOURCE_REQUIRED: "1"
        run: go test -v -run MatchSource ./spec/workload/
