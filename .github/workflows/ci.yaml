name: ci
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      # Formatting first: a diff here is mechanical and would otherwise obscure a
      # real failure below.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test -race ./...

  # The yaml tags are a contract with the files in blis-catalog and blis-registry.
  # Until something parses those files the tags are untested: a misspelled tag
  # compiles, validates, and silently drops the field it was meant to read. Every
  # committed file in both repositories failed to parse when this job was first added.
  #
  # The artifacts are VENDORED under testdata/ rather than checked out here. This
  # repository takes no dependency, not even a test dependency, on another repository's
  # current state: those move independently, so a job that checked out their main
  # branches would fail for reasons unrelated to any schema change -- and did, when the
  # registry dropped a coefficient set and the expected warning count became correct
  # against one tree and wrong against the other. testdata/refresh.sh updates the
  # snapshot, and the diff is the record of what this schema is known to accept.
  parse-committed-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: parse and validate every vendored catalog and registry file
        # Parsing is the tag contract; validating is the schema contract. The
        # EveryCommitted/EveryDerived tests were previously excluded by this filter
        # AND pinned to a developer's home directory, so the only check that loads
        # every ModelGraph through the published entry point ran nowhere.
        run: go test -v -run 'LoadCatalog|LoadRegistry|EveryCommitted|EveryDerived' .

      - name: validate the vendored graphs through the published binary
        # The same binary blis-catalog's CI invokes against itself, exercised here so
        # a schema change that rejects known-good catalog data fails in THIS
        # repository, where the change is being made, rather than downstream.
        run: go run ./cmd/validate-catalog testdata/catalog

  # The rules packs transcribe one engine release's configuration surface by hand.
  # These tests re-derive those constants from a checkout and fail on any divergence:
  # a value the pack accepts that the engine does not would validate a scenario that
  # cannot launch, and the reverse would reject a valid one.
  #
  # Separate job because it needs the engine tree. The job above passes without it,
  # and the tests there SKIP with a message naming what went unchecked, so a missing
  # checkout is visible rather than silent.
  constants-against-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: check out the engine at the pinned release
        uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          # The tag must match the version the pack under rules/ declares. A pack for
          # a new release arrives with its own job rather than by moving this ref.
          ref: v0.29.0
          path: vllm-source
          fetch-depth: 1
      - name: verify pack constants
        env:
          VLLM_SOURCE: ${{ github.workspace }}/vllm-source
        run: go test -v -run MatchSource ./rules/...
